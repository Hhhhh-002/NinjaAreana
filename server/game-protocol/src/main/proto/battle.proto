syntax = "proto3";
package ninja;
option java_package = "com.h.gameprotocol.proto";
option java_multiple_files = true;

message StatusSnapshot {
  uint64 instance_id = 1;
  uint32 effect_id = 2;
  int64 end_tick = 3;
  double remaining_shield = 4;
}
message CastSnapshot {
  uint64 cast_id = 1;
  uint64 caster_entity_id = 2;
  uint32 skill_id = 3;
  string phase = 4;
  int64 end_tick = 5;
}
message ProjectileSnapshot {
  uint64 instance_id = 1;
  uint64 source_cast_id = 2;
  uint64 owner_entity_id = 3;
  uint32 skill_id = 4;
  double x = 5;
  double y = 6;
  int32 facing = 7;
}
