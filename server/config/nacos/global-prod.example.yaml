# Import into your own Nacos namespace; replace passwords before use.
# 本机开发连接配置。发布到prod-Ninja命名空间 / DEFAULT_GROUP / global-prod.yaml。
# 命名空间ID：e7aa1b7a-358b-418b-92c4-afcb85fb585e；此文件已加入gitignore。
spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3307/Ninja?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: root
    password: "REPLACE_WITH_YOUR_PASSWORD"
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: "REPLACE_WITH_YOUR_PASSWORD"
      database: 0
      timeout: 3s
      connect-timeout: 2s
      repositories:
        enabled: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
          login-server:
            connectTimeout: 1000
            readTimeout: 85000
          agentmgr-server:
            connectTimeout: 1000
            readTimeout: 65000
    loadbalancer:
      retry:
        enabled: false

# 各服务仍使用自己本地的HTTP端口、实例ID、spring.application.name。
# Nacos地址、凭据、命名空间属于启动引导配置，保留在本地/环境变量中。
netty:
  gateway:
    websocket:
      port: 9001
      path: /ws
      bossthread: 1
      workthread: 12
      reader-idle-seconds: 60

gateway:
  rpc:
    timeout-ms: 90000
    register-timeout-ms: 10000
    max-attempts: 3
    max-in-flight-per-channel: 32
    feign-threads: 16
    feign-queue-per-thread: 64
  disconnect:
    timeout-ms: 35000
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 2000
    feign-threads: 8
    feign-queue: 512

login:
  password: "REPLACE_WITH_YOUR_PASSWORD"
  rpc:
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 2000

agentmgr:
  redis-key-prefix: "ninja:agentmgr:"
  lock-wait-ms: 200
  operation-timeout-ms: 90000
  result-wait-ms: 80000
  worker-threads: 16
  worker-queue: 512
  same-host-multiplier: 3
  idempotency-result-ttl-ms: 600000
  rpc-connect-timeout-ms: 1000
  rpc-read-timeout-ms: 8000
  rpc-max-attempts: 3
  initial-backoff-ms: 200
  max-backoff-ms: 2000

agent:
  websocket:
    port: 9101
    path: /internal/agent
  actor-threads: 4
  io-threads: 8
  io-queue: 512
  request-key-prefix: "ninja:agent:requests:"
  stopped-request-retention-seconds: 86400
  same-host-multiplier: 3
  scene-rpc-timeout-ms: 5000
  scene-input-response-timeout-ms: 15000

scene:
  websocket:
    port: 9201
    path: /internal/scene
  actor-threads: 4
  ranking-threads: 2
  ranking-queue: 128
  ranking-key-prefix: "ninja:match:"
  request-key-prefix: "ninja:scene:requests:"
  left-request-retention-seconds: 86400

battle:
  mode: VERSUS
  # 逻辑画布1440×480；两张背景都是3:1，客户端统一缩放，Y向下。
  width-px: 1440
  ground-y-px: 400
  jump-velocity-px-tick: -18
  gravity-px-tick2: 1.2
  max-fall-speed-px-tick: 18
  # CSV暂无普攻，保持为空；不阻止已有主动技能测试。
  basic-attack-skill-ids: "1101,2101"
  mana-regen-amount: 5
  mana-regen-interval-ticks: 30
  max-catch-up: 5
  max-pending-commands: 256
  max-scenes-per-instance: 128
  empty-scene-idle-seconds: 60
  match-duration-seconds: 600
  ranking-retention-days: 7
